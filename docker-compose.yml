version: '3.8'
services:
  pizzapi:
    container_name: pizzapi-container
    env_file:
      - path: ./pizzapi/.env
        required: false
    build:
      context: ./pizzapi
      dockerfile: Dockerfile
    image: yvann773/pizzapi:latest
    ports:
      - 3001:3001

  pizzapp:
    container_name: pizzapp-container
    build:
      context: ./pizzapp
      dockerfile: Dockerfile
    image: yvann773/pizzapp:latest
    ports:
      - 80:3000
