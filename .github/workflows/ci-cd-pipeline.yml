name: CI/CD Pipeline

on:
  push:
    branches:
      - prod
      - develop
      - feature/*

env:
  TAG: ${{ github.ref == 'refs/heads/prod' && 'prod' || 'staging' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [pizzapp, pizzapi]
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build ${{ matrix.service }}
        run: |
          docker build -t yvann773/${{ matrix.service }}:latest ./${{ matrix.service }}
      
      - name: Tag ${{ matrix.service }} for environment
        run: |
          docker tag yvann773/${{ matrix.service }}:latest yvann773/${{ matrix.service }}-${{ env.TAG }}:latest
      
      - name: Push ${{ matrix.service }}
        run: |
          docker push yvann773/${{ matrix.service }}-${{ env.TAG }}:latest

  deploy-staging:
    needs: build-and-push
    if: ${{ env.TAG == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_STAGING_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull yvann773/pizzapp-staging:latest
            docker pull yvann773/pizzapi-staging:latest
            docker stop pizzapp || true
            docker rm pizzapp || true
            docker run -d --name pizzapp -p 80:3000 yvann773/pizzapp-staging:latest
            docker stop pizzapi || true
            docker rm pizzapi || true
            docker run -d --name pizzapi -p 3001:3001 \
              -e PIZZAPI_FIREBASE_ADMIN_CONFIG='${{ secrets.PIZZAPI_FIREBASE_ADMIN_CONFIG }}' \
              -e PIZZAPI_FIREBASE_CLIENT_CONFIG='${{ secrets.PIZZAPI_FIREBASE_CLIENT_CONFIG }}' \
              yvann773/pizzapi-staging:latest

  deploy-prod:
    needs: build-and-push
    if: ${{ env.TAG == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull yvann773/pizzapp-prod:latest
            docker pull yvann773/pizzapi-prod:latest
            docker stop pizzapp || true
            docker rm pizzapp || true
            docker run -d --name pizzapp -p 80:3000 yvann773/pizzapp-prod:latest
            docker stop pizzapi || true
            docker rm pizzapi || true
            docker run -d --name pizzapi -p 3001:3001 \
              -e PIZZAPI_FIREBASE_ADMIN_CONFIG='${{ secrets.PIZZAPI_FIREBASE_ADMIN_CONFIG }}' \
              -e PIZZAPI_FIREBASE_CLIENT_CONFIG='${{ secrets.PIZZAPI_FIREBASE_CLIENT_CONFIG }}' \
              yvann773/pizzapi-prod:latest

