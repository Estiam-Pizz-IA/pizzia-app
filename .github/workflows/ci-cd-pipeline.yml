name: CI/CD Pipeline

on:
  push:
    branches:
      - prod
      - develop
      - feature/*

env:
  TAG: ${{ github.ref == 'refs/heads/prod' && 'prod' || 'staging' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [pizzapp, pizzapi]
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build ${{ matrix.service }}
        run: |
          docker build -t yvann773/${{ matrix.service }}:latest ./${{ matrix.service }}
      
      - name: Tag ${{ matrix.service }} for environment
        run: |
          docker tag yvann773/${{ matrix.service }}:latest yvann773/${{ matrix.service }}-${{ env.TAG }}:latest
      
      - name: Push ${{ matrix.service }}
        run: |
          docker push yvann773/${{ matrix.service }}-${{ env.TAG }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: staging
            condition: ${{ env.TAG == 'staging' }}
            host_secret: EC2_STAGING_HOST
          - environment: prod
            condition: ${{ env.TAG == 'prod' }}
            host_secret: EC2_PROD_HOST
    if: matrix.condition
    steps:
      - name: Deploy to ${{ matrix.environment }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull yvann773/pizzapp-${{ env.TAG }}:latest
            docker pull yvann773/pizzapi-${{ env.TAG }}:latest
            docker stop pizzapp || true
            docker rm pizzapp || true
            docker run -d --name pizzapp -p 80:3000 \
              -e NEXT_PUBLIC_API_URL=http://${{ secrets[matrix.host_secret] }}:3001 \
              yvann773/pizzapp-${{ env.TAG }}:latest
            docker stop pizzapi || true
            docker rm pizzapi || true
            docker run -d --name pizzapi -p 3001:3001 \
              -e PIZZAPI_FIREBASE_ADMIN_CONFIG='${{ secrets.PIZZAPI_FIREBASE_ADMIN_CONFIG }}' \
              -e PIZZAPI_FIREBASE_CLIENT_CONFIG='${{ secrets.PIZZAPI_FIREBASE_CLIENT_CONFIG }}' \
              yvann773/pizzapi-${{ env.TAG }}:latest
