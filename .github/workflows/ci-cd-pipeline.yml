name: CI/CD Pipeline

on:
  push:
    branches:
      - prod
      - develop
      - feature/*

env:
  TAG: ${{ github.ref == 'refs/heads/prod' && 'prod' || 'staging' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build images
        run: |
          docker compose -f docker-compose.yml build
      - name: Tag images
        run: |
          docker tag yvann773/pizzapp:latest yvann773/pizzapp-${TAG}:latest
          docker tag yvann773/pizzapi:latest yvann773/pizzapi-${TAG}:latest
      - name: Push images
        run: |
          docker push yvann773/pizzapp-${TAG}:latest
          docker push yvann773/pizzapi-${TAG}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set EC2 host
        id: set-host
        run: |
          echo "Current TAG: ${{ env.TAG }}"
          echo "Available secrets:"
          echo "EC2_HOST_STAGING exists: ${{ secrets.EC2_HOST_STAGING != '' }}"
          echo "EC2_HOST_PROD exists: ${{ secrets.EC2_HOST_PROD != '' }}"
          
          if [ "${{ env.TAG }}" == "prod" ]; then
            echo "Using PROD host"
            echo "ec2_host=${{ secrets.EC2_HOST_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "Using STAGING host"
            echo "ec2_host=${{ secrets.EC2_HOST_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Debug host value
        run: |
          echo "Selected host: ${{ steps.set-host.outputs.ec2_host }}"
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.set-host.outputs.ec2_host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull yvann773/pizzapp-${{ env.TAG }}:latest
            docker pull yvann773/pizzapi-${{ env.TAG }}:latest
            docker stop pizzapp || true
            docker rm pizzapp || true
            docker run -d --name pizzapp -p 80:3000 yvann773/pizzapp-${{ env.TAG }}:latest
            docker stop pizzapi || true
            docker rm pizzapi || true
            docker run -d --name pizzapi -p 3001:3001 yvann773/pizzapi-${{ env.TAG }}:latest
